name: "Node.js CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  merge_group:

permissions:
  contents: read

jobs:
  e2e:
    uses: "./.github/workflows/e2e.yml"
  format:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format check (changed files only)
        run: npm run format:check:changed

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm 10 crashes while resolving the package test's optional Vitest peers.
      - name: Use npm 11.19.0
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test Unit
        run: npm test
  vitest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each peer range is tested at its minimum and latest matching release.
        vitest-version: ["4.1.10", "^4.1.10", "5.0.4", "^5.0.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Match the npm version used by unit tests for optional peer resolution.
      - name: Use npm 11.19.0
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test published helpers with Vitest ${{ matrix.vitest-version }}
        run: npm run test:vitest-compat -- "${{ matrix.vitest-version }}"
